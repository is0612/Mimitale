<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="子夜酒馆">
  <defs>
    <radialGradient id="bg" cx="50%" cy="26%" r="80%">
      <stop offset="0" stop-color="#1b4a86"/>
      <stop offset="1" stop-color="#060b18"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#86b9ff"/>
    </linearGradient>
  </defs>

  <!-- 深蓝夜空：跟 logo 的底色一路，只是压得更深，16px 下才立得住 -->
  <circle cx="32" cy="32" r="30.5" fill="url(#bg)"/>

  <!-- 高脚杯：logo 里的那瓶星空酒的简化剪影 -->
  <path d="M20 17H44C44 27 39.5 36.5 32 39C24.5 36.5 20 27 20 17Z" fill="url(#cup)"/>
  <path d="M32 39V47" stroke="url(#cup)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M24 49.5H40" stroke="url(#cup)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 杯中的新月 -->
  <path d="M34.5 19.5A6.2 6.2 0 1 0 34.5 31.5A7.8 7.8 0 0 1 34.5 19.5Z" fill="#0b1b34"/>

  <!-- 一点琥珀色的星：把站上的「灯」收进图标里 -->
  <path d="M48 8.5 L49.7 12.8 L54 14.5 L49.7 16.2 L48 20.5 L46.3 16.2 L42 14.5 L46.3 12.8 Z" fill="#e8b84b"/>
</svg>
