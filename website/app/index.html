<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- 关键样式：样式表还在下载/解析时，底色就已经必须是对的。
       不内联的话，深色站会先白闪一下（浏览器默认白底）—— 它正好发生在
       首帧之后、内容之前，看上去就是「刚进来是空的」。
       color-scheme 顺带把滚动条也变成深色，不然深色页面配一条浅色滚动条。
       ⚠️ 这里的 #0b1226 必须跟 styles/tokens.css 的 --bg 一致，改一处要改两处。 -->
  <style>
    html { background: #0b1226; color-scheme: dark; }
  </style>
  <title>子夜酒馆 Mimitale — AI 角色扮演与互动故事</title>
  <meta name="description" content="导入 SillyTavern 角色卡，用世界书、状态面板和长对话记忆续写你的故事。记录本地保存，模型由你选择，通过自配 API 生成回复。">
  <!-- 移动端浏览器外壳着色，跟内联底色同值 -->
  <meta name="theme-color" content="#0b1226">
  <!-- 分享卡片（og:image 需要绝对地址，部署域名定了再补） -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="子夜酒馆 Mimitale — AI 角色扮演与互动故事">
  <meta property="og:description" content="角色卡、世界书、状态面板与长剧情记忆。记录本地保存，直连你选择的模型接口。">
  <meta property="og:locale" content="zh_CN">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;color:#e4e7ea">子夜酒馆（Mimitale）是桌面 AI 角色扮演与互动故事客户端。本官网需要 JavaScript；你也可以直接<a href="https://github.com/ls546280821/Mimitale" style="text-decoration:underline">访问源码与使用说明</a>。</p></noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
